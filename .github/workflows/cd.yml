name: CD — Deploy to Azure

on:
  push:
    branches: [main]
    paths:
      - 'nest-api/**'

defaults:
  run:
    working-directory: nest-api

jobs:
  deploy:
    name: Build & Push to Azure Container Registry
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./nest-api
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/guitarras-api:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/guitarras-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/guitarras-api:${{ github.sha }}

      - name: Logout from Azure
        if: always()
        run: az logout
